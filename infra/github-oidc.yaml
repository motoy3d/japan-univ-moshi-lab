# GitHub Actions から AWS にデプロイするための OIDC プロバイダと IAM ロール（初回だけ作成）。
# CloudFormation コンソールで「スタックの作成」→ このファイルをアップロード。
# ロールに付ける権限は CDK のブートストラップロールを引き受けることだけ（実際の作成・更新はそのロールが行う）。
AWSTemplateFormatVersion: "2010-09-09"
Description: moshi-lab GitHub Actions deploy role (OIDC)
Parameters:
  GitHubRepo:
    Type: String
    Default: motoy3d/japan-univ-moshi-lab
    Description: owner/repo
  CreateProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: アカウントに token.actions.githubusercontent.com の OIDC プロバイダがまだ無ければ true
Conditions:
  MakeProvider: !Equals [!Ref CreateProvider, "true"]
Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: moshi-lab-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # environment: production のジョブからだけ引き受けられる
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:production
      Policies:
        - PolicyName: assume-cdk-bootstrap-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-hnb659fds-*
Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: GitHub のリポジトリ変数 AWS_DEPLOY_ROLE_ARN に設定する
